
name: Refresh profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate statistics cards
        run: python scripts/generate_stats.py

      - name: Commit updated cards
        run: |
          if [[ -n "$(git status --porcelain assets/stats-dark.svg assets/stats-light.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/stats-dark.svg assets/stats-light.svg
            git commit -m "chore: refresh profile statistics"
            git push
          fi
